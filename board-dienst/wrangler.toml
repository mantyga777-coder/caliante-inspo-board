name = "caliante-board-dienst"
main = "index.js"
compatibility_date = "2025-06-01"

# Bremse gegen Passwort-Raten: 20 Anfragen pro Minute und Absender.
[[unsafe.bindings]]
name = "LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Eigene, großzügigere Bremse fürs Hochladen. Ein Upload ist kein Passwortversuch:
# wer zwanzig Bilder auf einmal ablegt, darf nicht mittendrin abgewiesen werden.
[[unsafe.bindings]]
name = "LIMIT_HOCHLADEN"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
