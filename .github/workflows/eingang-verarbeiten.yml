name: Hochgeladenes verarbeiten

# Laeuft, sobald Dateien im Ordner eingang/ landen — egal ob ueber das Board,
# ueber die GitHub-Oberflaeche oder per Telegram-Automatik.
on:
  push:
    branches: [main]
    paths:
      - 'eingang/**'
  workflow_dispatch:
  # Der Cloudflare-Dienst kann keine Dateien ins Repository schreiben (die Datei-API
  # von GitHub vertraegt nur Text). Er haengt Videos deshalb an das Release "eingang"
  # und klopft danach hier an.
  repository_dispatch:
    types: [neuer-upload]

permissions:
  contents: write

# Nie zwei Verarbeitungen gleichzeitig — sonst ueberschreiben sie sich eintraege.json.
concurrency:
  group: eingang
  cancel-in-progress: false

jobs:
  verarbeiten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hochgeladenes vom Ablageort holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immer ALLE Anhaenge abholen, nicht nur den zuletzt gemeldeten: waehrend ein
          # Lauf arbeitet, koennen weitere Uploads dazukommen. Deren Anklopfen wartet
          # (concurrency "eingang"), ihre Dateien wuerden sonst nie verarbeitet.
          namen=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/eingang" --jq '.assets[].name' 2>/dev/null || true)
          if [ -z "$namen" ]; then
            echo "Nichts abzuholen — es liegt nichts am Ablageort."
            exit 0
          fi
          mkdir -p eingang
          # Die Anhaenge werden hier NICHT geloescht, sondern erst nach dem gelungenen
          # Push. Sonst waere ein Video unwiederbringlich weg, sobald irgendetwas
          # dazwischen scheitert — ffmpeg, das Skript oder alle drei Push-Versuche.
          # Bleiben sie liegen, holt der naechste Lauf sie einfach noch einmal.
          : > "$RUNNER_TEMP/geholt.txt"
          while IFS= read -r name; do
            echo "Hole $name"
            gh release download eingang --repo "$GITHUB_REPOSITORY" --dir eingang --pattern "$name" --clobber
            printf '%s\n' "$name" >> "$RUNNER_TEMP/geholt.txt"
          done <<< "$namen"

      # ffmpeg ueber apt-get zu installieren kostete bei JEDEM Lauf 25-170 Sekunden.
      # actions/cache ist GitHubs eigener Zwischenspeicher: die fertigen Programmdateien
      # werden einmal abgelegt und ab dem zweiten Lauf in Sekunden wieder eingespielt.
      - name: ffmpeg aus dem Zwischenspeicher
        id: ffmpeg-speicher
        uses: actions/cache@v4
        with:
          path: ~/.ffmpeg-bin
          key: ffmpeg-static-linux64-v1

      - name: ffmpeg einmalig laden
        if: steps.ffmpeg-speicher.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.ffmpeg-bin
          if ! curl -sSL --fail --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            echo "Das Video-Werkzeug liess sich gerade nicht laden. Bitte diesen Lauf noch einmal starten."
            exit 1
          fi
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe ~/.ffmpeg-bin/
          chmod +x ~/.ffmpeg-bin/ffmpeg ~/.ffmpeg-bin/ffprobe

      - name: ffmpeg bereitstellen
        run: |
          echo "$HOME/.ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/.ffmpeg-bin/ffmpeg" -version | head -1

      - name: Dateien verarbeiten
        run: python3 eingang_verarbeiten.py

      - name: Seite neu bauen
        run: python3 render_web.py

      - name: Ergebnis prüfen
        run: |
          python3 -c "
          import re, json, sys
          h = open('index.html', encoding='utf-8').read()
          d = json.loads(re.search(r'const DATA=(\[.*?\]), CATS=', h, re.S).group(1), strict=False)
          videos = [v for v in d if v['type'] == 'video']
          ohne = [v for v in videos if not v.get('src')]
          if videos and ohne:
              print(f'{len(ohne)} von {len(videos)} Videos ohne abspielbaren Pfad — Abbruch.')
              sys.exit(1)
          print(f'Pruefung ok: {len(d)} Eintraege, {len(videos)} Videos abspielbar.')
          "

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}   # zum Aufräumen der Anhänge nach dem Push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nichts verarbeitet — nichts zu veroeffentlichen."
            exit 0
          fi
          git config user.name "Board-Automatik"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Hochgeladenes verarbeitet und Board neu gebaut"
          # Felix' Mac kann in derselben Minute veroeffentlicht haben. Dann ist der Stand
          # hier veraltet und der Push wird abgelehnt: erst nachziehen, dann erneut senden.
          for versuch in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Veroeffentlicht."
              # Jetzt erst aufraeumen: ab hier ist die Arbeit sicher im Repository.
              if [ -s "$RUNNER_TEMP/geholt.txt" ]; then
                while IFS= read -r name; do
                  gh release delete-asset eingang "$name" --repo "$GITHUB_REPOSITORY" --yes \
                    || echo "Hinweis: $name liess sich nicht vom Ablageort entfernen."
                done < "$RUNNER_TEMP/geholt.txt"
              fi
              exit 0
            fi
            echo "Versuch $versuch hat nicht geklappt, gleich nochmal."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Der neue Stand liess sich nicht veroeffentlichen."
          echo "Die Videos liegen noch am Ablageort — der naechste Upload holt sie mit ab."
          exit 1
